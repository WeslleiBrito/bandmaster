spring.application.name=bandmaster
server.port=8081

# ==============================================================
# DATASOURCE CONFIGURATION (Conexão com o Banco)
# ==============================================================
# Sintaxe: jdbc:mysql://HOST:PORT/DB_NAME
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:clarionerp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo

# Credenciais (lidas das variáveis de ambiente)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver (Opcional no Spring Boot moderno, mas bom para garantir)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / HIBERNATE SETTINGS
# ==============================================================
# "none" ou "validate" é OBRIGATÓRIO para legados.
# Se colocar "update" ou "create", o Java pode tentar alterar suas tabelas e quebrar o banco existente!
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL no console (útil para debug, igual o echo=False/True do Python)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Dialeto (O Spring geralmente detecta sozinho, mas força o MySQL 8/5)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ... suas configs de datasource ...

# DESATIVA a conversão automática de CamelCase para snake_case (txId -> tx_id)
# Usa exatamente o nome definido na anotação @Table ou @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Quando o loop Java pedir o histórico de uma parcela, o Hibernate vai olhar
# para as próximas 50 parcelas do loop e buscar o histórico de TODAS elas
# em uma única query SQL (WHERE IN (?....)).
# Isso transforma 1000 queries em apenas 20 queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Opcional: Melhora a inserção em massa também
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true