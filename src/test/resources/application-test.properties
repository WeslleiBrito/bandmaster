# ==========================================
# CONFIGURAÇÃO DE TESTE (H2 DATABASE)
# ==========================================

# Conexão em memória (o banco morre quando o teste acaba)
# MODE=MySQL: Faz o H2 aceitar sintaxe do MySQL
# DB_CLOSE_DELAY=-1: Mantém o banco vivo durante a execução de todos os testes
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

# create-drop: Cria as tabelas no início do teste e apaga no fim
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra o SQL no console (útil para debuggar testes)
spring.jpa.show-sql=true

# Usa o dialeto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# IMPORTANTE: Mantém a mesma estratégia de nomes do seu banco legado (para não dar erro de coluna 'tx_id')
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Desativa o Open-in-View para testes (boa prática)
spring.jpa.open-in-view=false